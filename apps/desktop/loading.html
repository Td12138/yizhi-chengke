<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>一纸成课 · 正在启动</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f9fc;
        --panel: #ffffff;
        --panel-2: #f1f5fb;
        --line: #dbe3ef;
        --text: #1a2333;
        --muted: #55647a;
        --dim: #77869b;
        --accent: #0f766e;
        --accent-2: #0284c7;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(1200px 600px at 10% -10%, #e6f2ff 0%, var(--bg) 55%);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      .brand {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--text);
      }
      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid rgba(15, 118, 110, 0.15);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      .hint { color: var(--muted); font-size: 14px; }
      .sub { color: var(--dim); font-size: 12px; }
      .bar {
        width: 220px;
        height: 4px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes slide {
        0% { transform: translateX(-30%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div class="brand">一纸成课</div>
    <div class="spinner"></div>
    <div class="hint">正在启动本地服务…</div>
    <div class="bar"><i></i></div>
    <div class="sub">正在初始化后端与本地数据，通常几秒</div>
  </body>
</html>
